services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3043}:80"
    volumes:
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:3043}
      DB_CONNECTION: mysql
      DB_HOST: ${COMPOSE_DB_HOST:-host.docker.internal}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/api/v1/properties > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["php"]
    command: ["artisan", "schedule:work"]
    user: www-data
    volumes:
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: ${COMPOSE_DB_HOST:-host.docker.internal}
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_storage:
