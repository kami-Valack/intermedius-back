services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3043}:80"
    volumes:
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:3043}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${COMPOSE_DB_DATABASE:-intermediarius}
      DB_USERNAME: ${COMPOSE_DB_USERNAME:-intermediarius}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1/api/v1/properties > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["php"]
    command: ["artisan", "schedule:work"]
    user: www-data
    volumes:
      - ./.env:/var/www/html/.env
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${COMPOSE_DB_DATABASE:-intermediarius}
      DB_USERNAME: ${COMPOSE_DB_USERNAME:-intermediarius}
      DB_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${COMPOSE_DB_DATABASE:-intermediarius}
      MYSQL_USER: ${COMPOSE_DB_USERNAME:-intermediarius}
      MYSQL_PASSWORD: ${COMPOSE_DB_PASSWORD:?Set COMPOSE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_DB_ROOT_PASSWORD:?Set COMPOSE_DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  app_storage:
  mysql_data:
